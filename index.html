<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkUp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 로그인 화면 -->
    <div id="login-screen">

        <div class="login-box">

            <h1>LinkUp</h1>

            <p>실시간 채팅을 시작해보세요.</p>

            <button id="google-login-btn">
                Google로 로그인
            </button>

        </div>

    </div>


    <!-- 메인 화면 -->
    <div
        id="chat-container"
        class="chat-container"
        style="display: none;"
    >

        <!-- 상단 -->
        <header class="chat-header">

            <div>
                <h1>LinkUp</h1>
                <p id="user-name"></p>
            </div>

            <button id="logout-btn">
                로그아웃
            </button>

        </header>


        <!-- 친구 검색 -->
        <section class="friends-section">

            <h2>친구 찾기</h2>

            <div class="friend-search">

                <input
                    type="text"
                    id="friend-search-input"
                    placeholder="이름 또는 이메일 검색"
                    autocomplete="off"
                >

                <button id="friend-search-btn">
                    검색
                </button>

            </div>

            <div id="search-results"></div>

        </section>


        <!-- 친구 요청 -->
        <section class="friends-section">

            <h2>받은 친구 요청</h2>

            <div id="friend-requests">
                <p>받은 친구 요청이 없습니다.</p>
            </div>

        </section>


        <!-- 친구 목록 -->
        <section class="friends-section">

            <h2>친구 목록</h2>

            <div id="friends-list">
                <p>친구가 없습니다.</p>
            </div>

        </section>


        <!-- 나중에 채팅방 목록이 들어갈 곳 -->
        <section class="chatrooms-section">

            <h2>채팅방</h2>

            <div id="chatrooms-list">
                <p>친구를 추가하면 채팅방을 만들 수 있습니다.</p>
            </div>

        </section>


        <!-- 기존 메시지 영역 -->
        <main
            id="messages"
            style="display: none;"
        ></main>


        <form
            id="message-form"
            style="display: none;"
        >

            <input
                type="text"
                id="message-input"
                placeholder="메시지를 입력하세요..."
                autocomplete="off"
                maxlength="500"
            >

            <button type="submit">
                전송
            </button>

        </form>

    </div>


    <script
        type="module"
        src="script.js"
    ></script>

</body>
</html>
