<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LINKUP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 로그인 화면 -->
    <section id="loginPage" class="page">

        <div class="login-box">

            <h1>LINKUP</h1>

            <p class="subtitle">
                친구들과 연결되는 메신저
            </p>

            <button id="googleLoginBtn" class="google-btn">
                Google로 시작하기
            </button>

        </div>

    </section>


    <!-- 메인 화면 -->
    <section id="mainPage" class="page hidden">

        <header class="top-bar">

            <div>
                <h1>LINKUP</h1>
            </div>

            <button id="logoutBtn">
                로그아웃
            </button>

        </header>


        <main>

            <!-- 내 프로필 -->
            <section class="profile-card">

                <img
                    id="profileImage"
                    src=""
                    alt="프로필"
                >

                <div>

                    <h2 id="profileName">
                        사용자
                    </h2>

                    <p id="profileEmail">
                        email
                    </p>

                </div>

            </section>


            <!-- 친구 -->
            <section class="section">

                <div class="section-title">

                    <h2>친구</h2>

                    <button id="addFriendBtn">
                        + 친구 추가
                    </button>

                </div>

                <div id="friendList">

                    <p class="empty">
                        아직 친구가 없습니다.
                    </p>

                </div>

            </section>


            <!-- 채팅 -->
            <section class="section">

                <h2>채팅</h2>

                <div id="chatList">

                    <p class="empty">
                        채팅방이 없습니다.
                    </p>

                </div>

            </section>

        </main>

    </section>


    <!-- 친구 추가 모달 -->
    <div id="friendModal" class="modal hidden">

        <div class="modal-box">

            <h2>친구 추가</h2>

            <input
                id="friendUidInput"
                type="text"
                placeholder="친구 UID 입력"
            >

            <div class="modal-buttons">

                <button id="cancelFriendBtn">
                    취소
                </button>

                <button id="confirmFriendBtn">
                    추가
                </button>

            </div>

        </div>

    </div>


    <!-- Firebase -->
    <script type="module" src="app.js"></script>

</body>
</html>
