<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>LinkUp</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 로그인 화면 -->
    <div id="login-screen">

        <div class="login-box">

            <h1>LinkUp</h1>

            <p>실시간 채팅을 시작해보세요.</p>

            <button id="google-login-btn">
                Google로 로그인
            </button>

        </div>

    </div>


    <!-- 채팅 화면 -->
    <div
        class="chat-container"
        id="chat-container"
        style="display: none;"
    >

        <header class="chat-header">

            <div>
                <h1>LinkUp</h1>
                <p id="user-name"></p>
            </div>

            <button id="logout-btn">
                로그아웃
            </button>

        </header>


        <main id="messages">

            <div class="system-message">
                채팅방에 오신 것을 환영합니다!
            </div>

        </main>


        <form id="message-form">

            <input
                type="text"
                id="message-input"
                placeholder="메시지를 입력하세요..."
                autocomplete="off"
                maxlength="500"
            >

            <button type="submit">
                전송
            </button>

        </form>

    </div>


    <script
        type="module"
        src="script.js"
    ></script>

</body>
</html>
